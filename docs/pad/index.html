<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pad</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1f232c;
    --line: #2e3440;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --pc: #7c8596; /* kolor gracza - ustawia host */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .badge {
    min-width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--pc); color: #fff; font-weight: 800; font-size: 18px;
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { color: var(--muted); }
  .ping { display: flex; align-items: center; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
  .dot.good { background: #22c55e; } .dot.ok { background: #eab308; } .dot.bad { background: #ef4444; }

  main { flex: 1; position: relative; min-height: 0; }
  section { position: absolute; inset: 0; display: none; padding: 16px; }
  section.active { display: flex; }

  .center { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  .center h1 { margin: 0; font-size: 24px; }
  .center p { margin: 0; color: var(--muted); max-width: 340px; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--pc); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #lobby { flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  label { color: var(--muted); font-size: 14px; display: block; margin-bottom: 6px; }
  .field { width: min(360px, 100%); }
  input {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel); color: var(--text); outline: none; user-select: text; -webkit-user-select: text;
  }
  input:focus { border-color: var(--pc); }
  #ready {
    width: min(360px, 100%); padding: 22px; border-radius: 18px; border: 3px solid var(--pc);
    background: transparent; color: var(--text); font: inherit; font-size: 24px; font-weight: 800; letter-spacing: 0.04em;
  }
  #ready.on { background: var(--pc); color: #fff; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; }

  #game { padding: 0; }
  .controls {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 4vmin 5vmin 6vmin; gap: 4vmin;
  }
  .move { display: flex; gap: 4vmin; }
  .btn {
    display: grid; place-items: center; border: 3px solid var(--pc);
    background: var(--panel); border-radius: 22px;
    transition: transform 40ms, background 40ms;
  }
  .btn svg { width: 46%; height: 46%; fill: var(--text); pointer-events: none; }
  .btn.pressed { background: var(--pc); transform: scale(0.94); }
  .move .btn { width: min(30vmin, 22vw); height: min(30vmin, 22vw); min-width: 92px; min-height: 92px; }
  .jump { width: min(42vmin, 30vw); height: min(42vmin, 30vw); min-width: 120px; min-height: 120px; border-radius: 50%; }
  .rotate {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); font-size: 14px;
  }
  @media (orientation: portrait) { .rotate { display: block; } }

  #overlay {
    position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 12, 16, 0.78); z-index: 5;
  }
  #overlay.show { display: grid; }
  #overlay div { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="badge" id="badge">?</div>
  <div class="who"><b id="nameLabel">Gracz</b><small id="phaseLabel">Łączenie…</small></div>
  <div class="ping"><span class="dot" id="dot"></span><span id="ping">— ms</span></div>
</header>

<main>
  <section id="connecting" class="center active">
    <div class="spinner"></div>
    <h1 id="connectingTitle">Łączenie z hostem…</h1>
    <p>Telefon musi być w tej samej sieci Wi-Fi co komputer z grą.</p>
    <p class="hint" id="connectingDetail"></p>
  </section>

  <section id="message" class="center">
    <h1 id="messageTitle"></h1>
    <p id="messageText"></p>
  </section>

  <section id="lobby">
    <div class="field">
      <label for="name">Twoja nazwa</label>
      <input id="name" maxlength="20" autocomplete="off" enterkeyhint="done">
    </div>
    <button id="ready" type="button">GOTOWY</button>
    <div class="hint">Patrz na ekran hosta – gra wystartuje, gdy wszyscy będą gotowi.</div>
  </section>

  <section id="game">
    <div class="rotate">Obróć telefon poziomo</div>
    <div class="controls">
      <div class="move">
        <div class="btn" data-btn="1" aria-label="W lewo"><svg viewBox="0 0 24 24"><path d="M15.5 4 6.5 12l9 8z"/></svg></div>
        <div class="btn" data-btn="2" aria-label="W prawo"><svg viewBox="0 0 24 24"><path d="M8.5 4l9 8-9 8z"/></svg></div>
      </div>
      <div class="btn jump" data-btn="4" aria-label="Skok"><svg viewBox="0 0 24 24"><path d="M12 5 4 16h16z"/></svg></div>
    </div>
  </section>
</main>

<div id="overlay"><div><div class="spinner"></div><b>Połączenie zerwane – łączę ponownie…</b></div></div>

<script>
(() => {
  'use strict';
  // Telefon i host "poznaja sie" przez Unity Lobby (projekt UCH), potem dane ida bezposrednio po Wi-Fi przez WebRTC.
  const PROJECT_ID = 'c20affb9-2679-4a87-9f8c-81b013a45c45';
  const ENVIRONMENT = 'production';
  const AUTH_URL = 'https://player-auth.services.api.unity.com/v1/authentication';
  const LOBBY_URL = 'https://lobby.services.api.unity.com/v1';
  const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
  const MAX_LOBBY_VALUE = 2048;
  const GATHER_TIMEOUT_MS = 2500;
  const POLL_INTERVAL_MS = 1100;      // limit Lobby: odczyt max raz na sekunde
  const ANSWER_TIMEOUT_MS = 15000;
  const OPEN_TIMEOUT_MS = 10000;
  const INPUT_RESEND_MS = 100;        // kanal wejscia jest bez retransmisji - stan powtarzamy, zgubiony pakiet nie zostawi wcisnietego przycisku
  const PING_INTERVAL_MS = 500;       // czeste pingi trzymaja Wi-Fi telefonu w trybie aktywnym (mniejsze skoki opoznienia)
  const DEAD_AFTER_MS = 3000;
  const VIBRATE_MS = 8;

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* tryb prywatny */ } }
  };
  const randomHex = bytes => Array.from(crypto.getRandomValues(new Uint8Array(bytes)), b => b.toString(16).padStart(2, '0')).join('');

  class FatalError extends Error {
    constructor(title, text) { super(title); this.title = title; this.text = text; }
  }

  const lobbyCode = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  const cleanName = value => value.replace(/[|<>\u0000-\u001f]/g, '').trim().slice(0, 20);
  let name = cleanName(store.get('padName') || '') || 'Gracz';
  let ready = false;
  let screenName = 'connecting';
  let mask = 0, mouseMask = 0, keyMask = 0;
  let sequence = 0, jumpCount = 0;
  let auth = null, lobbyId = null;
  let pc = null, ctl = null, inp = null;
  let lastMessageAt = 0;
  let wasConnected = false;
  let connecting = false;
  let rttSmoothed = null;

  const nameInput = $('name');
  nameInput.value = name;
  $('nameLabel').textContent = name;

  function show(id) {
    screenName = id;
    document.querySelectorAll('main > section').forEach(s => s.classList.toggle('active', s.id === id));
    $('phaseLabel').textContent = { lobby: 'Lobby', game: 'Gra', connecting: 'Łączenie…' }[id] || '';
    if (id !== 'game') setMask(0);
  }

  function showMessage(title, text) {
    $('messageTitle').textContent = title;
    $('messageText').textContent = text;
    show('message');
  }

  // ---------- Unity Gaming Services (logowanie anonimowe + Lobby) ----------

  async function authPost(path, body) {
    const response = await fetch(AUTH_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ProjectId: PROJECT_ID, UnityEnvironment: ENVIRONMENT },
      body: JSON.stringify(body)
    });
    if (!response.ok) throw new Error('auth ' + response.status);
    const result = await response.json();
    store.set('ugsSession', result.sessionToken);  // ten sam gracz po odswiezeniu strony = ta sama postac u hosta
    return result;
  }

  async function signIn() {
    const sessionToken = store.get('ugsSession');
    if (sessionToken) {
      try { return await authPost('/session-token', { sessionToken }); } catch (e) { /* sesja wygasla */ }
    }
    return authPost('/anonymous', {});
  }

  async function lobbyFetch(method, path, body, retried) {
    const response = await fetch(LOBBY_URL + path, {
      method,
      headers: { 'Content-Type': 'application/json', ProjectId: PROJECT_ID, Authorization: 'Bearer ' + auth.idToken },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (response.status === 401 && !retried) {
      auth = await signIn();
      return lobbyFetch(method, path, body, true);
    }
    const text = await response.text();
    const json = text ? JSON.parse(text) : null;
    if (!response.ok) {
      const error = new Error('lobby ' + response.status);
      error.status = response.status;
      error.code = json && json.code;
      throw error;
    }
    return json;
  }

  async function joinLobby() {
    const storageKey = 'padLobby:' + lobbyCode;
    try {
      const lobby = await lobbyFetch('POST', '/joinbycode', { lobbyCode, player: { id: auth.userId, data: {} } });
      store.set(storageKey, lobby.id);
      return lobby.id;
    } catch (e) {
      if (e.code === 16003) {  // juz jestesmy w tym lobby (odswiezona strona)
        const saved = store.get(storageKey);
        if (saved) return saved;
        const joined = await lobbyFetch('GET', '/joined');
        if (joined && joined.length) return joined[joined.length - 1];
      }
      if (e.status === 404) throw new FatalError('Gra już nie istnieje', 'Host zamknął grę albo kod jest nieaktualny. Zeskanuj kod QR jeszcze raz.');
      if (e.status === 409) throw new FatalError('Brak wolnych miejsc', 'Wszystkie pady są zajęte. Odśwież stronę, gdy ktoś wyjdzie.');
      throw e;
    }
  }

  // ---------- WebRTC ----------

  function waitForGathering(peer) {
    return new Promise(resolve => {
      if (peer.iceGatheringState === 'complete') return resolve();
      const timer = setTimeout(resolve, GATHER_TIMEOUT_MS);
      peer.addEventListener('icegatheringstatechange', () => {
        if (peer.iceGatheringState === 'complete') { clearTimeout(timer); resolve(); }
      });
    });
  }

  // Pole Lobby miesci 2048 znakow - przy wielu kandydatach wyrzucamy te, ktore w sieci lokalnej nie pomoga.
  function fitSdp(sdp, maxLength) {
    let lines = sdp.split('\r\n').filter(Boolean);
    const droppable = [l => / tcp /i.test(l), l => / typ relay/.test(l), l => / typ srflx/.test(l)];
    for (const drop of droppable) {
      if (lines.join('\r\n').length + 2 <= maxLength) break;
      lines = lines.filter(l => !(l.startsWith('a=candidate:') && drop(l)));
    }
    return lines.join('\r\n') + '\r\n';
  }

  function waitForOpen(channel) {
    return new Promise((resolve, reject) => {
      if (channel.readyState === 'open') return resolve();
      const timer = setTimeout(() => reject(new Error('timeout open')), OPEN_TIMEOUT_MS);
      channel.addEventListener('open', () => { clearTimeout(timer); resolve(); });
      channel.addEventListener('close', () => { clearTimeout(timer); reject(new Error('closed')); });
    });
  }

  function closePeer() {
    const peer = pc;
    pc = ctl = inp = null;
    if (peer) {
      peer.onconnectionstatechange = null;
      try { peer.close(); } catch (e) { /* juz zamkniete */ }
    }
  }

  // Etap laczenia widoczny pod tytulem - gracz moze przepisac go przy zglaszaniu problemu.
  function setDetail(text) {
    $('connectingDetail').textContent = text;
  }

  async function connectPeer() {
    closePeer();
    const peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peer.oniceconnectionstatechange = () => {
      if (pc === peer && peer.iceConnectionState !== 'connected') setDetail('Wi-Fi: ' + peer.iceConnectionState);
    };
    const control = peer.createDataChannel('ctl');
    const input = peer.createDataChannel('in', { ordered: false, maxRetransmits: 0 });
    [control, input].forEach(channel => {
      channel.binaryType = 'arraybuffer';
      channel.onmessage = e => {
        lastMessageAt = performance.now();
        handleMessage(typeof e.data === 'string' ? e.data : new TextDecoder().decode(e.data));
      };
    });
    pc = peer; ctl = control; inp = input;

    await peer.setLocalDescription(await peer.createOffer());
    await waitForGathering(peer);

    const nonce = randomHex(4);
    const offer = nonce + '|' + fitSdp(peer.localDescription.sdp, MAX_LOBBY_VALUE - nonce.length - 1);
    await lobbyFetch('POST', `/${lobbyId}/players/${auth.userId}`, { data: { o: { value: offer, visibility: 'member' } } });
    setDetail('Czekam na odpowiedź hosta…');

    // Host odpowiada w danych lobby: idGracza|nonce|sdp.
    const prefix = `${auth.userId}|${nonce}|`;
    const deadline = performance.now() + ANSWER_TIMEOUT_MS;
    let answer = null;
    while (!answer && performance.now() < deadline) {
      await sleep(POLL_INTERVAL_MS);
      if (pc !== peer) throw new Error('replaced');
      try {
        const lobby = await lobbyFetch('GET', `/${lobbyId}`);
        const values = Object.values(lobby.data || {}).map(d => d.value || '');
        const match = values.find(v => v.startsWith(prefix));
        if (match) answer = match.slice(prefix.length);
      } catch (e) {
        if (e.status === 404) throw new FatalError('Gra już nie istnieje', 'Host zamknął grę. Zeskanuj nowy kod QR.');
        if (e.status !== 429) throw e;  // 429 = za czesto, po prostu probujemy dalej
      }
    }
    if (!answer) throw new Error('host nie odpowiedział – czy gra na komputerze jest w lobby?');

    setDetail('Łączenie bezpośrednie po Wi-Fi…');
    await peer.setRemoteDescription({ type: 'answer', sdp: answer });
    try {
      await waitForOpen(control);
    } catch (e) {
      throw new Error('brak bezpośredniego połączenia po Wi-Fi (' + peer.iceConnectionState + ')');
    }

    peer.onconnectionstatechange = () => {
      if (pc === peer && peer.connectionState === 'failed') reconnect();
    };
    control.onclose = () => { if (pc === peer) reconnect(); };

    lastMessageAt = performance.now();
    sequence = 0;
    jumpCount = 0;
    mask = 0;
    control.send(`h|${auth.userId}|${name}`);
    control.send('r|' + (ready ? 1 : 0));
    sendInput();
  }

  async function run() {
    if (connecting) return;
    connecting = true;
    let delay = 500;
    let attempt = 0;
    while (true) {
      attempt++;
      try {
        $('connectingTitle').textContent = 'Logowanie…';
        if (!auth) auth = await signIn();
        $('connectingTitle').textContent = 'Dołączanie do gry…';
        if (!lobbyId) lobbyId = await joinLobby();
        $('connectingTitle').textContent = 'Łączenie z hostem…';
        await connectPeer();
        wasConnected = true;
        $('overlay').classList.remove('show');
        break;
      } catch (e) {
        closePeer();
        if (e instanceof FatalError) {
          $('overlay').classList.remove('show');
          showMessage(e.title, e.text);
          break;
        }
        console.warn('Pad: proba polaczenia nieudana', e);
        setDetail(`Próba ${attempt} nieudana: ${e.message}. Ponawiam…`);
        await sleep(delay);
        delay = Math.min(delay * 2, 4000);
      }
    }
    connecting = false;
  }

  function reconnect() {
    closePeer();
    if (wasConnected && screenName !== 'message') $('overlay').classList.add('show');
    $('dot').className = 'dot bad';
    run();
  }

  // ---------- Protokol ----------

  function sendControl(message) {
    if (ctl && ctl.readyState === 'open') ctl.send(message);
  }

  function sendInput() {
    if (inp && inp.readyState === 'open') inp.send(`i|${++sequence}|${mask}|${jumpCount}`);
  }

  function handleMessage(data) {
    const parts = data.split('|');
    switch (parts[0]) {
      case 'w':
        $('badge').textContent = parts[1];
        document.documentElement.style.setProperty('--pc', parts[2]);
        document.querySelector('meta[name=theme-color]').content = parts[2];
        break;
      case 's':
        show(parts[1] === 'game' ? 'game' : 'lobby');
        break;
      case 'o':
        showPing(performance.now() - parseFloat(parts[1]));
        break;
      case 'f':
        closePeer();
        showMessage('Brak wolnych miejsc', 'Wszystkie pady są zajęte. Odśwież stronę, gdy ktoś wyjdzie.');
        break;
    }
  }

  function showPing(rtt) {
    rttSmoothed = rttSmoothed === null ? rtt : rttSmoothed * 0.7 + rtt * 0.3;
    const ms = Math.round(rttSmoothed);
    $('ping').textContent = ms + ' ms';
    $('dot').className = 'dot ' + (ms < 30 ? 'good' : ms < 80 ? 'ok' : 'bad');
  }

  setInterval(() => {
    if (!inp || inp.readyState !== 'open') return;
    if (performance.now() - lastMessageAt > DEAD_AFTER_MS) {
      reconnect();  // zerwane Wi-Fi nie zawsze zamyka kanal - brak odpowiedzi na pingi wystarczy
      return;
    }
    inp.send('p|' + performance.now().toFixed(1));
  }, PING_INTERVAL_MS);

  setInterval(() => {
    if (screenName === 'game') sendInput();
  }, INPUT_RESEND_MS);

  // ---------- Sterowanie ----------

  // Kazda zmiana przyciskow wychodzi natychmiast. Licznik skokow pozwala hostowi odzyskac tap z zgubionego pakietu.
  function setMask(value) {
    if (value === mask) return;
    const pressedNow = value & ~mask;
    if (pressedNow & 4) jumpCount++;
    mask = value;
    document.querySelectorAll('[data-btn]').forEach(b => b.classList.toggle('pressed', (mask & +b.dataset.btn) !== 0));
    if (pressedNow && navigator.vibrate) navigator.vibrate(VIBRATE_MS);
    sendInput();
  }

  // Wiele palcow naraz + przesuwanie palca miedzy przyciskami (lewo -> prawo bez odrywania).
  function maskFromTouches(touches) {
    let result = 0;
    for (const t of touches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const btn = el && el.closest('[data-btn]');
      if (btn) result |= +btn.dataset.btn;
    }
    return result;
  }

  function onTouch(e) {
    if (screenName !== 'game') return;
    e.preventDefault();
    setMask(maskFromTouches(e.touches) | mouseMask | keyMask);
  }
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(type => document.addEventListener(type, onTouch, { passive: false }));

  // Pelny ekran + poziomo przy pierwszym dotknieciu gry (przegladarka wymaga gestu uzytkownika).
  let fullscreenTried = false;
  document.addEventListener('touchend', () => {
    if (screenName !== 'game' || fullscreenTried) return;
    fullscreenTried = true;
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!request) return;
    Promise.resolve(request.call(root))
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
      .catch(() => {});
  });

  // Mysz i klawiatura - do testow na komputerze.
  function onMouse(e) {
    if (screenName !== 'game') return;
    const btn = e.buttons ? e.target.closest && e.target.closest('[data-btn]') : null;
    mouseMask = btn ? +btn.dataset.btn : 0;
    setMask(mouseMask | keyMask);
  }
  ['mousedown', 'mousemove', 'mouseup'].forEach(type => document.addEventListener(type, onMouse));
  const keyBits = { ArrowLeft: 1, KeyA: 1, ArrowRight: 2, KeyD: 2, Space: 4, ArrowUp: 4, KeyW: 4 };
  function onKey(e) {
    if (screenName !== 'game' || !keyBits[e.code]) return;
    e.preventDefault();
    keyMask = e.type === 'keydown' ? keyMask | keyBits[e.code] : keyMask & ~keyBits[e.code];
    setMask(mouseMask | keyMask);
  }
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKey);

  $('ready').addEventListener('click', () => {
    ready = !ready;
    renderReady();
    sendControl('r|' + (ready ? 1 : 0));
  });

  function renderReady() {
    $('ready').classList.toggle('on', ready);
    $('ready').textContent = ready ? 'GOTOWY ✓' : 'GOTOWY';
  }

  let nameTimer = 0;
  nameInput.addEventListener('input', () => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      name = cleanName(nameInput.value) || 'Gracz';
      $('nameLabel').textContent = name;
      store.set('padName', name);
      sendControl('n|' + name);
    }, 250);
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      mouseMask = keyMask = 0;
      setMask(0);  // zablokowany ekran nie moze zostawic wcisnietego przycisku
    } else if (!pc && screenName !== 'message') {
      reconnect();
    }
  });

  renderReady();
  if (!lobbyCode) {
    showMessage('Brak kodu gry', 'Zeskanuj kod QR z ekranu komputera, na którym działa gra.');
  } else {
    run();
  }
})();
</script>
